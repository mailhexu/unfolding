name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # phonopy's last py3.9-compatible release (2.45.1) ships no cp39
          # wheels and its sdist fails to build, so the phonopy extra is
          # only exercised on 3.12. Guard tests simulate missing backends
          # via sys.modules poisoning and never need them installed.
          - python-version: "3.9"
            extras: "dev"
          - python-version: "3.12"
            extras: "dev,phonopy"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Run tests
        run: python -m pytest tests/ -q
