[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unfolding"
version = "0.2.0"
description = "Bloch wave unfolding"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-2-Clause"}
authors = [
    {name = "Xu He", email = "mailhexu@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "matplotlib",
    "ase",
]

[project.optional-dependencies]
phonopy = ["phonopy"]
abipy = ["abipy"]
abinit = ["netCDF4"]
siesta = ["HamiltonIO[siesta]>=0.3.8"]
tb2j = ["TB2J"]
dev = ["pytest", "sympy"]

[project.urls]
Homepage = "https://github.com/mailhexu/unfolding"
Documentation = "https://mailhexu.github.io/unfolding/"
Issues = "https://github.com/mailhexu/unfolding/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["unfolding*"]
